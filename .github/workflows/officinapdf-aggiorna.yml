name: OfficinaPDF - nuova versione

# Ogni settimana (e a richiesta dalla scheda Actions > "Run workflow"): prende le novità di PdfCraft,
# le unisce a OfficinaPDF con il suo nome, esegue i test, prepara l'installer e lo pubblica come
# "Release". Su ogni computer OfficinaPDF controlla queste Release e si aggiorna da solo
# (crates/ui-egui/src/dialogs/whats_new/update.rs).
#
# Il lavoro vero è in aggiorna-da-pdfcraft.ps1 -Ci, lo stesso script che si usa sul PC. Se manca
# qualcosa (conflitto con PdfCraft, test che non passano) lo script si ferma: non esce nessuna
# versione e quella di prima resta quella più recente. GitHub manda un'email per la corsa fallita.
#
# Serve il segreto PUSH_TOKEN (Settings > Secrets and variables > Actions): un token personale
# con i permessi "repo" e "workflow". Quello automatico di GitHub non può salvare la cronologia di
# PdfCraft, che contiene modifiche ai suoi file di automazione.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      salta_test:
        description: "Salta i test (solo per una prova)"
        type: boolean
        default: false
      ripubblica:
        description: "Solo ripubblica una versione già salvata (es. 0.9.0): ricrea l'installer da quel tag, niente unione né test"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: officinapdf-aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Controllo del token
        shell: pwsh
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if (-not $env:PUSH_TOKEN) {
            Write-Error 'Manca il segreto PUSH_TOKEN: vedi le istruzioni in .github/workflows/officinapdf-aggiorna.yml'
            exit 1
          }

      # Le righe dei file restano come sono nel repository: niente conversione CRLF.
      - name: Impostazioni di git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global user.name 'TonyAF1'
          git config --global user.email 'TonyAF1@users.noreply.github.com'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Collego PdfCraft
        shell: pwsh
        run: git remote add upstream https://github.com/storytold/pdfcraft.git

      - name: Rust aggiornato
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: WiX (crea l'installer)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/5.0.2

      - name: Aggiorna, prova e prepara l'installer
        id: build
        if: inputs.ripubblica == ''
        shell: pwsh
        run: |
          if ('${{ inputs.salta_test }}' -eq 'true') { ./aggiorna-da-pdfcraft.ps1 -Ci -SaltaTest } else { ./aggiorna-da-pdfcraft.ps1 -Ci }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Per una versione già su main ma senza Release (pubblicazione fallita): ricrea i pacchetti da
      # quel tag, come li fa lo script.
      - name: Ricreo l'installer di una versione già salvata
        id: rebuild
        if: inputs.ripubblica != ''
        shell: pwsh
        env:
          VERSIONE: ${{ inputs.ripubblica }}
        run: |
          if ($env:VERSIONE -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Versione non valida: $env:VERSIONE"; exit 1 }
          git checkout --quiet "v$env:VERSIONE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./packaging/windows/package-officinapdf.ps1 -OutDir dist
          . ./packaging/windows/officinapdf-nome.ps1
          $leggimi = [IO.File]::ReadAllText('packaging/windows/officinapdf-leggimi.txt').Replace('{VERSIONE}', $env:VERSIONE)
          [IO.File]::WriteAllText('dist/LEGGIMI.txt', $leggimi, $OfficinaUtf8)
          $sums = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(msi|zip)$' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText('dist/SHA256SUMS.txt', (($sums -join "`n") + "`n"), $OfficinaUtf8)
          [IO.File]::WriteAllText('dist/note.md', "OfficinaPDF $env:VERSIONE.", $OfficinaUtf8)
          "versione=$env:VERSIONE" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # I pacchetti restano scaricabili dalla pagina della corsa anche se la pubblicazione fallisce.
      - name: Conservo i pacchetti
        if: steps.build.outputs.novita == 'true' || steps.rebuild.outputs.versione != ''
        uses: actions/upload-artifact@v4
        with:
          name: officinapdf-pacchetti
          path: dist/
          retention-days: 30

      - name: Salvo l'aggiornamento
        if: steps.build.outputs.novita == 'true'
        shell: pwsh
        env:
          VERSIONE: ${{ steps.build.outputs.versione }}
        run: |
          git push origin main "v$env:VERSIONE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # La Release si crea con l'API (la risposta completa finisce nel registro se GitHub rifiuta),
      # poi si aggiungono i file. Rifatto da capo, riusa la Release che c'è già.
      # Sempre --repo: con il remote "upstream" gh sceglierebbe il repository di PdfCraft.
      - name: Pubblico la versione
        if: steps.build.outputs.novita == 'true' || steps.rebuild.outputs.versione != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ steps.build.outputs.versione || steps.rebuild.outputs.versione }}
        run: |
          $tag = "v$env:VERSIONE"
          $repo = $env:GITHUB_REPOSITORY
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '^(OfficinaPDF-.*\.(msi|zip)|SHA256SUMS\.txt|LEGGIMI\.txt)$' } | ForEach-Object { $_.FullName })
          if ($files.Count -lt 3) { Write-Error "Mancano i pacchetti in dist: $($files -join ', ')"; exit 1 }
          gh api "repos/$repo/releases/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            $body = [IO.File]::ReadAllText('dist/note.md')
            gh api "repos/$repo/releases" -X POST -f tag_name="$tag" -f name="OfficinaPDF $env:VERSIONE" -f body="$body" -f make_latest=true --include
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'GitHub ha rifiutato la Release. Le Release che vede (anche le bozze):'
              gh api "repos/$repo/releases" --jq '.[] | "\(.tag_name) draft=\(.draft) id=\(.id)"'
              exit 1
            }
          }
          gh release upload $tag @files --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $tag --repo $repo
